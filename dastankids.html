<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>در حال انتقال به مارکت…</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Vazirmatn",Tahoma,sans-serif;
    background:#0e1420;color:#eef2f8;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .box{max-width:360px;width:100%}
  .spinner{
    width:52px;height:52px;margin:0 auto 22px;
    border:4px solid #26314a;border-top-color:#2d6cdf;
    border-radius:50%;animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:1.1rem;font-weight:700;margin-bottom:8px}
  p{color:#8f9bb0;font-size:.88rem;line-height:1.9}
  #fallback{display:none;margin-top:20px}
  #fallback a{
    display:block;color:#7ab8ff;text-decoration:none;
    padding:10px;font-size:.95rem;
  }
  @media (prefers-reduced-motion: reduce){.spinner{animation:none}}
</style>
</head>
<body>

<div class="box">
  <div class="spinner"></div>
  <h1 id="title">در حال باز کردن مارکت…</h1>
  <p id="status">لطفاً چند لحظه صبر کنید</p>

  <div id="fallback">
    <p>اگر به‌صورت خودکار منتقل نشدید:</p>
    <a id="linkBazaar" href="#">مشاهده در کافه‌بازار</a>
    <a id="linkMyket" href="#">مشاهده در مایکت</a>
  </div>
</div>

<script>
/* ==================== تنظیمات ==================== */
// نام پکیج برنامه‌تان را اینجا بگذارید
const PACKAGE = "info.kvmdev97.dastankids";

// اولویت به‌صورت تصادفی انتخاب می‌شود تا نصب بین دو مارکت پخش شود
// (۵۰٪ کاربران اول بازار، ۵۰٪ اول مایکت)
const FIRST = Math.random() < 0.5 ? "bazaar" : "myket";

const BAZAAR_WEB = "https://cafebazaar.ir/app/" + PACKAGE;
const MYKET_WEB  = "https://myket.ir/app/" + PACKAGE;
/* ================================================= */

const isAndroid = /android/i.test(navigator.userAgent);
const statusEl = document.getElementById("status");
const titleEl  = document.getElementById("title");

document.getElementById("linkBazaar").href = BAZAAR_WEB;
document.getElementById("linkMyket").href  = MYKET_WEB;

const bazaarIntent = "intent://details?id=" + PACKAGE +
  "#Intent;scheme=bazaar;package=com.farsitel.bazaar;end";
const myketIntent = "intent://details?id=" + PACKAGE +
  "#Intent;scheme=myket;package=ir.mservices.market;end";

// تلاش برای باز کردن اپ؛ اگر بعد از مهلت مشخص صفحه هنوز دیده می‌شد یعنی نصب نیست
function tryOpen(intentUrl, onFail) {
  let opened = false;
  const markOpened = () => { opened = true; };

  document.addEventListener("visibilitychange", markOpened, { once: true });
  window.addEventListener("pagehide", markOpened, { once: true });
  window.addEventListener("blur", markOpened, { once: true });

  location.href = intentUrl;

  setTimeout(() => {
    if (!opened && !document.hidden) onFail();
  }, 1500);
}

function showFallback() {
  titleEl.textContent = "انتقال خودکار انجام نشد";
  statusEl.textContent = "یکی از لینک‌های زیر را انتخاب کنید:";
  document.querySelector(".spinner").style.display = "none";
  document.getElementById("fallback").style.display = "block";
}

function start() {
  if (!isAndroid) {
    // روی دسکتاپ / iOS مستقیم صفحه وب مارکت باز می‌شود
    location.href = (FIRST === "bazaar") ? BAZAAR_WEB : MYKET_WEB;
    return;
  }

  const firstIntent  = (FIRST === "bazaar") ? bazaarIntent : myketIntent;
  const secondIntent = (FIRST === "bazaar") ? myketIntent  : bazaarIntent;
  const firstWeb     = (FIRST === "bazaar") ? BAZAAR_WEB   : MYKET_WEB;

  tryOpen(firstIntent, () => {
    statusEl.textContent = "در حال بررسی مارکت دیگر…";
    tryOpen(secondIntent, () => {
      // هیچ مارکتی نصب نیست → نسخه وب
      statusEl.textContent = "در حال باز کردن نسخه وب…";
      setTimeout(() => {
        location.href = firstWeb;
        // اگر حتی این هم مسدود شد، لینک‌های دستی نمایش داده می‌شوند
        setTimeout(showFallback, 2000);
      }, 400);
    });
  });
}

// شروع خودکار بلافاصله بعد از لود صفحه
window.addEventListener("load", start);
</script>
</body>
</html>
